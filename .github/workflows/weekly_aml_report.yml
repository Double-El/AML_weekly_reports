name: Weekly AML Regulatory Announcements Report

on:
  schedule:
    # 매주 월요일 한국 시간(KST) 오전 9:00 (UTC 일요일 24:00 / 월요일 00:00)
    - cron: '0 0 * * 1'
  workflow_dispatch: # 수동 실행 지원

jobs:
  run-aml-agent:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          playwright install --with-deps chromium

      - name: Run AML Report AI Agent
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ secrets.GEMINI_MODEL || 'gemini-3.5-flash' }}
          SMTP_EMAIL: ${{ secrets.SMTP_EMAIL }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          SMTP_SERVER: ${{ secrets.SMTP_SERVER || 'smtp.gmail.com' }}
          SMTP_PORT: ${{ secrets.SMTP_PORT || '587' }}
        run: |
          python main.py

      - name: Upload Generated Reports and Screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: aml-weekly-reports
          path: |
            reports/
            screenshots/
          retention-days: 30

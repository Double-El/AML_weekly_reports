name: Weekly AML Regulatory Announcements Report

on:
  schedule:
    # 매주 월요일 한국 시간(KST) 오전 8:00 정기 자동 실행 (UTC 기준 일요일 23:00)
    - cron: '0 23 * * 0'
  workflow_dispatch: # GitHub 웹 UI에서 수동 실행 및 옵션 지정 지원
    inputs:
      target_date:
        description: '기준 날짜 (YYYY-MM-DD 형식, 예: 2026-08-24 -> 8월 3주차 생성). 미입력 시 직전 주차 자동 계산'
        required: false
        default: ''
        type: string
      dry_run:
        description: '이메일 발송 없이 수집 및 보고서 생성만 수행 (테스트용)'
        required: false
        default: false
        type: boolean
      skip_screenshot:
        description: '스크린샷 캡처 단계 건너뛰기 (빠른 실행용)'
        required: false
        default: false
        type: boolean

jobs:
  run-aml-agent:
    name: Generate & Send AML Weekly Insight Report
    runs-on: ubuntu-latest

    steps:
      # 1. 저장소 코드 체크아웃
      - name: Check out repository
        uses: actions/checkout@v4

      # 2. 파이썬 3.11 환경 설정 및 pip 캐시 적용
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      # 3. 우분투 러너의 시스템 타임존을 한국 표준시(Asia/Seoul)로 설정
      - name: Set Timezone to Asia/Seoul
        run: |
          sudo timedatectl set-timezone Asia/Seoul

      # 4. 필수 라이브러리 및 Playwright 브라우저 설치
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          playwright install --with-deps chromium

      # 5. AML AI Agent 파이프라인 실행 및 이메일 발송
      - name: Run AML Report AI Agent
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ secrets.GEMINI_MODEL || 'gemini-2.5-flash' }}
          SMTP_EMAIL: ${{ secrets.SMTP_EMAIL }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          SMTP_SERVER: ${{ secrets.SMTP_SERVER || 'smtp.gmail.com' }}
          SMTP_PORT: ${{ secrets.SMTP_PORT || '587' }}
          PYTHONIOENCODING: "utf-8"
          TZ: "Asia/Seoul"
        run: |
          ARGS=""
          if [ -n "${{ inputs.target_date }}" ]; then
            ARGS="$ARGS --target-date ${{ inputs.target_date }}"
          fi
          if [ "${{ inputs.dry_run }}" = "true" ]; then
            ARGS="$ARGS --dry-run"
          fi
          if [ "${{ inputs.skip_screenshot }}" = "true" ]; then
            ARGS="$ARGS --skip-screenshot"
          fi

          echo "Running: python main.py $ARGS"
          python main.py $ARGS

      # 6. 생성된 주간 보고서 전문을 GitHub Action 결과 페이지(Summary)에 렌더링
      - name: Display Report in GitHub Action Summary
        if: always()
        run: |
          LATEST_TXT=$(ls -t reports/aml_report_*.txt 2>/dev/null | head -n 1)
          if [ -n "$LATEST_TXT" ] && [ -f "$LATEST_TXT" ]; then
            echo "### 📄 AML & Sanctions Weekly Insight Report Preview" >> $GITHUB_STEP_SUMMARY
            echo '```text' >> $GITHUB_STEP_SUMMARY
            cat "$LATEST_TXT" >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
          fi

      # 7. 생성된 TXT/HTML 보고서 및 스크린샷 아티팩트 업로드 (30일 보관)
      - name: Upload Generated Reports and Screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: aml-weekly-reports
          path: |
            reports/
            screenshots/
          retention-days: 30
